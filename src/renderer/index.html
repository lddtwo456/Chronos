<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Security-Policy" content="script-src 'self';" />
        <title>Bello</title>
    </head>
    <body>
        <button id="generate">generate</button>
        <input id="bars" type="range" min="1" max="16" value="2" step="1" />
        <p>Bars: <output id="num_bars"></output></p>

        <button id="play">play</button>
        <input id="bpm" type="range" min="80" max="160" value="120" step="5" />
        <p>BPM: <output id="selected_bpm"></output></p>

        <div id="score"></div>

        <canvas id="graph" width="800" height="400"></canvas>
        
        <script src="../../node_modules/tone/build/Tone.js"></script>
        <script src="../../node_modules/chart.js/dist/chart.umd.min.js"></script>
        <script src="../../node_modules/vexflow/build/cjs/vexflow-core.js" type="module"></script>
        <script src="../shared/generator.js" type="module"></script>
        <script src="./vexflow/noteRenderer.js" type="module"></script>
        <script src="index.js" type="module"></script>
    </body>
</html>
